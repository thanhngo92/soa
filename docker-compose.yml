# ─────────────────────────────────────────────────────────────────────────────
# Network ports summary:
#   Frontend      : 3659  (local dev only, not in compose)
#   API Gateway   : 8877
#   account-svc   : 8661
#   tuition-svc   : 8732
#   payment-svc   : 8815
#   notification  : 8940
#   MySQL 8.0     : 8552  (Unified RDBMS on custom port 8552)
#   Mailpit SMTP  : 1025
#   Mailpit Web   : 8025  →  http://localhost:8025
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: soa-mysql
    restart: unless-stopped
    command: --port=8552
    ports:
      - "8552:8552"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - soa-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - soa-net

  # ── Backend Microservices (All using MySQL with Database-Per-Service) ────────
  account-service:
    build:
      context: ./backend/account-service
    container_name: account-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8661"]
    ports:
      - "8661:8661"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 8552
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: account_db
      JWT_SECRET: super_secret_jwt_key_change_in_prod
      JWT_EXPIRE_MINUTES: 60
    depends_on:
      - mysql
    networks:
      - soa-net

  tuition-service:
    build:
      context: ./backend/tuition-service
    container_name: tuition-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8732"]
    ports:
      - "8732:8732"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 8552
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: tuition_db
      JWT_SECRET: super_secret_jwt_key_change_in_prod
    depends_on:
      - mysql
    networks:
      - soa-net

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: notification-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8940"]
    ports:
      - "8940:8940"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 8552
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: notification_db
      JWT_SECRET: super_secret_jwt_key_change_in_prod
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: noreply@ibanking.local
    depends_on:
      - mysql
      - mailpit
    networks:
      - soa-net

  payment-service:
    build:
      context: ./backend/payment-service
    container_name: payment-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8815"]
    ports:
      - "8815:8815"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 8552
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: payment_db
      JWT_SECRET: super_secret_jwt_key_change_in_prod
      ACCOUNT_SERVICE_URL: http://account-service:8661
      TUITION_SERVICE_URL: http://tuition-service:8732
      NOTIFICATION_SERVICE_URL: http://notification-service:8940
    depends_on:
      - mysql
      - account-service
      - tuition-service
      - notification-service
    networks:
      - soa-net

  # ── API Gateway ──────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8877:8877"
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8661
      TUITION_SERVICE_URL: http://tuition-service:8732
      PAYMENT_SERVICE_URL: http://payment-service:8815
      NOTIFICATION_SERVICE_URL: http://notification-service:8940
      ALLOWED_ORIGIN: http://localhost:3659
    depends_on:
      - account-service
      - tuition-service
      - payment-service
      - notification-service
    networks:
      - soa-net

networks:
  soa-net:
    driver: bridge

volumes:
  mysql_data:
