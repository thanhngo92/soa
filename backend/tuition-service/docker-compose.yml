# ─────────────────────────────────────────────────────────────────────────────
# Tuition Service — Standalone Microservice Docker Compose
# ─────────────────────────────────────────────────────────────────────────────

services:
  tuition-db:
    image: mysql:8.0
    container_name: tuition-db
    restart: unless-stopped
    command: --port=8552
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tuition_db
    ports:
      - "8552:8552"
    volumes:
      - ../../init-db/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - tuition_mysql_data:/var/lib/mysql
    networks:
      - tuition-net

  tuition-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuition-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8732"]
    ports:
      - "8732:8732"
    environment:
      MYSQL_HOST: tuition-db
      MYSQL_PORT: 8552
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: tuition_db
      JWT_SECRET: super_secret_jwt_key_change_in_prod
    depends_on:
      - tuition-db
    networks:
      - tuition-net

networks:
  tuition-net:
    driver: bridge

volumes:
  tuition_mysql_data:
