# ─────────────────────────────────────────────────────────────────────────────
# Payment Service — Standalone Microservice Docker Compose
# ─────────────────────────────────────────────────────────────────────────────

services:
  payment-db:
    image: mysql:8.0
    container_name: payment-db
    restart: unless-stopped
    command: --port=8552
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: payment_db
    ports:
      - "8552:8552"
    volumes:
      - ../../init-db/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - payment_mysql_data:/var/lib/mysql
    networks:
      - payment-net

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8815"]
    ports:
      - "8815:8815"
    environment:
      MYSQL_HOST: payment-db
      MYSQL_PORT: 8552
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: payment_db
      JWT_SECRET: super_secret_jwt_key_change_in_prod
      ACCOUNT_SERVICE_URL: http://host.docker.internal:8661
      TUITION_SERVICE_URL: http://host.docker.internal:8732
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:8940
    depends_on:
      - payment-db
    networks:
      - payment-net

networks:
  payment-net:
    driver: bridge

volumes:
  payment_mysql_data:
